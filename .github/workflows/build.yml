name: cicdpipeline
on:
  push:
  workflow_dispatch:
jobs:
  pythonapplication:
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v4
      - name: build docker image
        run: docker build -t imagename.v1.0.0 .
      - name: run container
        run: docker run -d -p 5000:5000 --name cont1 imagename.v1.0.0 
      - name: smoke test
        run: |
          sleep 5
          curl: http://localhost:5000/health
 
